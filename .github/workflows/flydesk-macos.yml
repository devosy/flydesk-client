name: FlyDesk macOS build

# Manual build of the FlyDesk macOS (Apple Silicon) client. The build steps are the aarch64 half
# of `build-for-macOS` in flutter-build.yml; keep the tool versions below in step with that file
# when merging upstream.
#
# Signing. Without the secrets below the app is ad-hoc signed: it runs, but macOS refuses to open
# a downloaded copy ("Apple could not verify ..."). With them, the app and the dmg are signed with
# the Developer ID certificate (hardened runtime), the dmg is notarized by Apple and the ticket is
# stapled to it, so macOS opens it like any identified app. Repository secrets:
#   MACOS_P12_BASE64        the "Developer ID Application" certificate with its private key,
#                           exported as .p12, base64 encoded
#   MACOS_P12_PASSWORD      the password of that .p12
#   MACOS_NOTARY_KEY_BASE64 an App Store Connect API key (.p8, team key), base64 encoded
#   MACOS_NOTARY_KEY_ID     its key ID
#   MACOS_NOTARY_ISSUER_ID  its issuer ID
#
# Server settings come from the repository variables FLYDESK_SERVER and FLYDESK_KEY
# (see flydesk-windows.yml).

# msk-rustdesk: the `brand` input picks the client built from this code — FlyDesk (the checkout)
# or MskDesk (MSK logo, Arabic by default, bundle id com.mskdesk.desktop, link scheme mskdesk://),
# applied by res/brand.py before the build. Same server, key and CRM for both.

on:
  workflow_dispatch:
    inputs:
      brand:
        description: "Client brand"
        type: choice
        options: [flydesk, mskdesk]
        default: flydesk

permissions:
  contents: read

env:
  MAC_RUST_VERSION: "1.91"  # fly3-rustdesk-voice: the echo-cancel feature (sonora) needs 1.91
  FLUTTER_MACOS_ARM_VERSION: "3.44.9"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VERSION: "1.5.1"
  BRAND: "${{ inputs.brand || 'flydesk' }}"
  APP_NAME: "${{ inputs.brand == 'mskdesk' && 'MskDesk' || 'FlyDesk' }}"
  FLYDESK_APP_NAME: "${{ inputs.brand == 'mskdesk' && 'MskDesk' || 'FlyDesk' }}"
  FLYDESK_LANG: "${{ inputs.brand == 'mskdesk' && 'ar' || 'fr' }}"
  FLYDESK_SERVER: "${{ vars.FLYDESK_SERVER }}"
  FLYDESK_KEY: "${{ vars.FLYDESK_KEY }}"
  FLYDESK_API: "${{ vars.FLYDESK_API }}"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-macos-arm64:
    name: ${{ inputs.brand == 'mskdesk' && 'MskDesk' || 'FlyDesk' }} aarch64-apple-darwin
    needs: [generate-bridge]
    runs-on: macos-15
    env:
      TARGET: aarch64-apple-darwin
      VCPKG_TRIPLET: arm64-osx
      APP_PATH: ./flutter/build/macos/Build/Products/Release/${{ inputs.brand == 'mskdesk' && 'MskDesk' || 'FlyDesk' }}.app
      # 'true' when the certificate secret is set; otherwise the ad-hoc signature is kept. Only
      # this flag is visible to every step: the certificate itself is given to the signing step.
      SIGN_WITH_DEVELOPER_ID: "${{ secrets.MACOS_P12_BASE64 != '' }}"
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Install build runtime
        run: |
          brew install llvm create-dmg
          if command -v pkg-config &>/dev/null; then
              echo "pkg-config is already installed"
          else
              brew install pkg-config
          fi

      - name: Install NASM
        run: |
          # NASM 2.16.x from the official release; NASM 3.x (brew) is incompatible with aom and others.
          wget https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/macosx/nasm-2.16.03-macosx.zip
          unzip nasm-2.16.03-macosx.zip
          sudo cp nasm-2.16.03/nasm /usr/local/bin/nasm
          nasm --version

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_MACOS_ARM_VERSION }}

      - name: Keep CocoaPods for Flutter 3.44
        run: flutter config --no-enable-swift-package-manager

      - name: Workaround for flutter issue
        shell: bash
        run: |
          cd "$(dirname "$(which flutter)")"
          # https://github.com/flutter/flutter/issues/133533
          sed -i -e 's/_setFramesEnabledState(false);/\/\/_setFramesEnabledState(false);/g' ../packages/flutter/lib/src/scheduler/binding.dart
          grep -n '_setFramesEnabledState(false);' ../packages/flutter/lib/src/scheduler/binding.dart

      - name: Patch sources for Flutter 3.44
        # The script uses GNU `sed -i`, which macOS's BSD sed rejects.
        shell: bash
        run: |
          brew install gnu-sed
          export PATH="$(brew --prefix gnu-sed)/libexec/gnubin:$PATH"
          bash .github/patches/apply_flutter_3.44_source_patches.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.MAC_RUST_VERSION }}
          targets: ${{ env.TARGET }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: ${{ env.BRAND }}-macos-15

      - name: Apply the brand (name, bundle id, link scheme, icons, logo)
        if: env.BRAND != 'flydesk'
        run: python3 res/brand.py apply "$BRAND"

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact-flutter-3.44
          path: ./

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi

      - name: Build ${{ env.APP_NAME }}
        run: |
          MIN_MACOS_VERSION="12.3"
          sed -i -e "s/MACOSX_DEPLOYMENT_TARGET\=[0-9]*.[0-9]*/MACOSX_DEPLOYMENT_TARGET=${MIN_MACOS_VERSION}/" build.py
          sed -i -e "s/platform :osx, '.*'/platform :osx, '${MIN_MACOS_VERSION}'/" flutter/macos/Podfile
          sed -i -e "s/osx_minimum_system_version = \"[0-9]*.[0-9]*\"/osx_minimum_system_version = \"${MIN_MACOS_VERSION}\"/" Cargo.toml
          sed -i -e "s/MACOSX_DEPLOYMENT_TARGET = [0-9]*.[0-9]*;/MACOSX_DEPLOYMENT_TARGET = ${MIN_MACOS_VERSION};/" flutter/macos/Runner.xcodeproj/project.pbxproj
          echo "MACOSX_DEPLOYMENT_TARGET=${MIN_MACOS_VERSION}" >> "$GITHUB_ENV"
          ./build.py --flutter --hwcodec --unix-file-copy-paste --screencapturekit --echo-cancel
          ls -la "$APP_PATH/Contents/MacOS"

      - name: Ad-hoc sign the app
        if: env.SIGN_WITH_DEVELOPER_ID != 'true'
        # build.py adds the service binary after Xcode signed the bundle, so the bundle is signed
        # again. Ad-hoc identity, no hardened runtime (it would refuse the ad-hoc signed libraries).
        run: |
          codesign --force --deep --sign - --entitlements ./flutter/macos/Runner/Release.entitlements "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign -dv "$APP_PATH" 2>&1 | grep -E "Identifier|Signature|TeamIdentifier"

      - name: Sign the app with the Developer ID certificate
        if: env.SIGN_WITH_DEVELOPER_ID == 'true'
        # The certificate goes into a keychain of its own, created for this run (GitHub's recipe
        # for Apple certificates on macOS runners). Hardened runtime and a secure timestamp are
        # both required by notarization.
        env:
          MACOS_P12_BASE64: ${{ secrets.MACOS_P12_BASE64 }}
          MACOS_P12_PASSWORD: ${{ secrets.MACOS_P12_PASSWORD }}
        run: |
          SIGN_KEYCHAIN="$RUNNER_TEMP/flydesk-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          P12_FILE="$RUNNER_TEMP/developer-id.p12"
          echo "$MACOS_P12_BASE64" | base64 --decode > "$P12_FILE"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$SIGN_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$SIGN_KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$SIGN_KEYCHAIN"
          security import "$P12_FILE" -P "$MACOS_P12_PASSWORD" -A -t cert -f pkcs12 -k "$SIGN_KEYCHAIN"
          rm -f "$P12_FILE"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$SIGN_KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$SIGN_KEYCHAIN"
          SIGN_IDENTITY="$(security find-identity -v -p codesigning "$SIGN_KEYCHAIN" | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -1)"
          if [ -z "$SIGN_IDENTITY" ]; then
            echo "::error::MACOS_P12_BASE64 holds no 'Developer ID Application' certificate with its private key"
            exit 1
          fi
          echo "Signing as: $SIGN_IDENTITY"
          echo "SIGN_KEYCHAIN=$SIGN_KEYCHAIN" >> "$GITHUB_ENV"
          echo "SIGN_IDENTITY=$SIGN_IDENTITY" >> "$GITHUB_ENV"
          codesign --force --deep --options runtime --timestamp --keychain "$SIGN_KEYCHAIN" --sign "$SIGN_IDENTITY" --entitlements ./flutter/macos/Runner/Release.entitlements "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign -dv "$APP_PATH" 2>&1 | grep -E "Identifier|Authority|TeamIdentifier|Timestamp|flags"

      - name: Smoke test (the built app starts and reports its version)
        run: |
          reported_version="$("$APP_PATH/Contents/MacOS/$APP_NAME" --version)"
          echo "Reported version: '$reported_version'"
          if [ "$reported_version" != "$VERSION" ]; then
            echo "::error::$APP_NAME reports version '$reported_version', expected '$VERSION'"
            exit 1
          fi

      - name: Create dmg
        run: |
          DMG="$APP_NAME-$VERSION-aarch64.dmg"
          echo "DMG=$DMG" >> "$GITHUB_ENV"
          CREATE_DMG="$(command -v create-dmg)"
          CREATE_DMG="$(readlink -f "$CREATE_DMG")"
          sed -i -e 's/MAXIMUM_UNMOUNTING_ATTEMPTS=3/MAXIMUM_UNMOUNTING_ATTEMPTS=7/' "$CREATE_DMG"
          create-dmg --icon "$APP_NAME.app" 200 190 --hide-extension "$APP_NAME.app" --window-size 800 400 --app-drop-link 600 185 "$DMG" "$APP_PATH"
          shasum -a 256 "$DMG"

      - name: Sign, notarize and staple the dmg
        if: env.SIGN_WITH_DEVELOPER_ID == 'true'
        # Apple checks the dmg and everything in it; the ticket is then stapled to the dmg so that
        # the check also passes on a Mac that is offline. The sha256 printed here is the one of the
        # file that is uploaded (stapling changes the dmg).
        env:
          MACOS_NOTARY_KEY_BASE64: ${{ secrets.MACOS_NOTARY_KEY_BASE64 }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          if [ -z "$MACOS_NOTARY_KEY_BASE64" ] || [ -z "$MACOS_NOTARY_KEY_ID" ] || [ -z "$MACOS_NOTARY_ISSUER_ID" ]; then
            echo "::error::MACOS_NOTARY_KEY_BASE64, MACOS_NOTARY_KEY_ID and MACOS_NOTARY_ISSUER_ID are required with MACOS_P12_BASE64"
            exit 1
          fi
          codesign --force --timestamp --keychain "$SIGN_KEYCHAIN" --sign "$SIGN_IDENTITY" "$DMG"
          NOTARY_KEY="$RUNNER_TEMP/notary-key.p8"
          trap 'rm -f "$NOTARY_KEY"' EXIT
          echo "$MACOS_NOTARY_KEY_BASE64" | base64 --decode > "$NOTARY_KEY"
          xcrun notarytool submit "$DMG" --key "$NOTARY_KEY" --key-id "$MACOS_NOTARY_KEY_ID" --issuer "$MACOS_NOTARY_ISSUER_ID" --wait --timeout 45m --output-format json > notary-result.json || true
          cat notary-result.json
          NOTARY_STATUS="$(plutil -extract status raw -o - notary-result.json || true)"
          NOTARY_ID="$(plutil -extract id raw -o - notary-result.json || true)"
          if [ "$NOTARY_STATUS" != "Accepted" ]; then
            if [ -n "$NOTARY_ID" ]; then
              xcrun notarytool log "$NOTARY_ID" --key "$NOTARY_KEY" --key-id "$MACOS_NOTARY_KEY_ID" --issuer "$MACOS_NOTARY_ISSUER_ID" || true
            fi
            echo "::error::Apple did not accept the dmg (status '$NOTARY_STATUS')"
            exit 1
          fi
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG"
          shasum -a 256 "$DMG"

      - name: Remove the signing keychain
        if: always() && env.SIGN_KEYCHAIN != ''
        run: security delete-keychain "$SIGN_KEYCHAIN" || true

      - name: Upload dmg
        # the dmg, not the directory: uploading the bundle directly destroys its link structure
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.BRAND }}-macos-aarch64-dmg
          path: ${{ env.DMG }}
          if-no-files-found: error
