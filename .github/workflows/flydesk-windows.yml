name: FlyDesk Windows build

# Manual build of the FlyDesk Windows x64 client. The build steps are the x86_64 half of
# `build-for-windows-flutter` in flutter-build.yml; keep the tool versions below in step with
# that file when merging upstream.
#
# Server settings are compiled in from two repository variables (Settings -> Secrets and
# variables -> Actions -> Variables): FLYDESK_SERVER (host of the ID server) and FLYDESK_KEY
# (its public key). Left empty, the build points at a placeholder host. FLYDESK_API is the base
# URL of the CRM that opens support sessions (e.g. https://crm.example.com); left empty, the app
# cannot be linked to a chat session and works by ID only.
#
# msk-rustdesk: the `brand` input picks the client built from this code — FlyDesk (the checkout)
# or MskDesk (MSK logo, Arabic by default, bundle id com.mskdesk.desktop, link scheme mskdesk://),
# applied by res/brand.py before the build. Same server, key and CRM for both.

on:
  workflow_dispatch:
    inputs:
      brand:
        description: "Client brand"
        type: choice
        options: [flydesk, mskdesk]
        default: flydesk

permissions:
  contents: read

env:
  SCITER_RUST_VERSION: "1.91"  # fly3-rustdesk-voice: the echo-cancel feature (sonora) needs 1.91
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VERSION: "1.5.1"
  BRAND: "${{ inputs.brand || 'flydesk' }}"
  APP_NAME: "${{ inputs.brand == 'mskdesk' && 'MskDesk' || 'FlyDesk' }}"
  FLYDESK_APP_NAME: "${{ inputs.brand == 'mskdesk' && 'MskDesk' || 'FlyDesk' }}"
  FLYDESK_LANG: "${{ inputs.brand == 'mskdesk' && 'ar' || 'fr' }}"
  FLYDESK_SERVER: "${{ vars.FLYDESK_SERVER }}"
  FLYDESK_KEY: "${{ vars.FLYDESK_KEY }}"
  FLYDESK_API: "${{ vars.FLYDESK_API }}"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-windows-x64:
    name: ${{ inputs.brand == 'mskdesk' && 'MskDesk' || 'FlyDesk' }} x86_64-pc-windows-msvc
    needs: [generate-bridge]
    runs-on: windows-2022
    env:
      TARGET: x86_64-pc-windows-msvc
      VCPKG_TRIPLET: x64-windows-static
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Apply the brand (name, bundle id, link scheme, icons, logo)
        if: env.BRAND != 'flydesk'
        shell: bash
        run: python3 res/brand.py apply "$BRAND"

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      # https://github.com/flutter/flutter/issues/155685
      - name: Replace engine with the custom flutter engine
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          if [[ "3.24.5" == ${{ env.FLUTTER_VERSION }} ]]; then
            git apply flutter_3.24.4_dropdown_menu_enableFilter.diff
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.SCITER_RUST_VERSION }}
          targets: ${{ env.TARGET }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: ${{ env.BRAND }}-windows-2022

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: ${{ env.VCPKG_TRIPLET }}
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --triplet ${{ env.VCPKG_TRIPLET }} \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi
        shell: bash

      - name: Build ${{ env.APP_NAME }}
        run: |
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram --echo-cancel
          mv ./flutter/build/windows/x64/runner/Release ./flydesk
          mv ./flydesk/rustdesk.exe ./flydesk/${{ env.APP_NAME }}.exe

      - name: Upload app folder
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.BRAND }}-windows-x86_64-folder
          path: flydesk
          if-no-files-found: error

      - name: find Runner.res
        # Runner.rc does not contain the actual version, Runner.res does
        continue-on-error: true
        shell: bash
        run: |
          runner_res=$(find . -name "Runner.res");
          if [ "$runner_res" == "" ]; then
            echo "Runner.res: not found";
          else
            echo "Runner.res: $runner_res";
            cp $runner_res ./libs/portable/Runner.res;
            ls -l ./libs/portable/Runner.res;
          fi

      - name: Build self-extracted executable
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../flydesk/ -o . -e ../../flydesk/${{ env.APP_NAME }}.exe
          popd
          mkdir -p ./dist
          mv ./target/release/rustdesk-portable-packer.exe ./dist/${{ env.APP_NAME }}-${{ env.VERSION }}-x86_64.exe
          sha256sum ./dist/*.exe

      - name: Upload self-extracted executable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.BRAND }}-windows-x86_64-exe
          path: ./dist
          if-no-files-found: error

      - name: Smoke test (the built app starts and reports its version)
        shell: powershell
        run: |
          $reportedVersion = (& ".\flydesk\${{ env.APP_NAME }}.exe" --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "${{ env.APP_NAME }}.exe --version exited with $LASTEXITCODE"
          }
          Write-Host "Reported version: '$reportedVersion'"
          if ($reportedVersion -cne $env:VERSION) {
            throw "${{ env.APP_NAME }} reports version '$reportedVersion', expected '$env:VERSION'"
          }
